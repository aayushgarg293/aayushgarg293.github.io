<style>
  :root { --ink:#3A2A1E; --cream:#FFF7E6; --red:#E8533C; --muted:#6B5746; --bg:#FFE7B0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:'Nunito',system-ui,sans-serif; color:var(--ink); background:var(--bg);
         background-image:radial-gradient(rgba(58,42,30,.13) 1.4px, transparent 1.4px); background-size:22px 22px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; max-width:1000px; margin:0 auto; padding:16px 20px; font-family:'Baloo 2',cursive; font-weight:800; }
  .bar a { text-decoration:none; color:var(--ink); background:var(--cream); border:3px solid var(--ink); border-radius:999px; padding:5px 14px; box-shadow:3px 4px 0 var(--ink); }
  .bar a:hover { background:var(--red); color:var(--cream); }
  h1 { font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(34px,6vw,60px); text-align:center; margin:18px 20px 4px; line-height:1; }
  .lede { text-align:center; font-weight:700; color:var(--muted); margin:0 20px; }
  /* 2. The game goes in here */
  #stage { max-width:1000px; min-height:60vh; margin:24px auto; padding:16px; display:flex; align-items:center; justify-content:center; }
  /* 3. Explain the engineering — this is what makes the game a portfolio piece */
  .how { max-width:680px; margin:40px auto 60px; padding:26px 28px; background:var(--cream); border:3.5px solid var(--ink); border-radius:22px; box-shadow:6px 7px 0 var(--ink); line-height:1.7; font-weight:600; }
  .how h2 { font-family:'Baloo 2',cursive; font-weight:800; margin:0 0 8px; font-size:28px; }
  .how .kick { font-family:'Caveat',cursive; font-size:22px; color:#C8402C; }
</style>
